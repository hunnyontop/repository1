<head>

        * {
            margin: 10px;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: rgb(255, 82, 0);
            background-image: url(https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Veggies_new.png);
            background-repeat: no-repeat;
            
        }

        .navigation-bar {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-inline: 120px;

        }

        .logo-img {
            width: 160px;

        }

        .app-btn {
             background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 500;
            font-family: Arial, sans-serif; */

        }

        .signin-btn {
             background: transparent;
            color: #fff;
            border: 1.5px solid rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            padding: 16px 30px;
            font-size: 20px;
            font-weight: 500;
            background-color: black;
            font-family: Arial, sans-serif;
            transition: 0.3s ease; */
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
        }

        .link {
            margin: 40px;
            margin-left: 400px;
            color: white;
            text-decoration: none;
            display: flex;
            gap: 5px;
            white-space: nowrap;
 
        }

        .head {
            text-align: center;
            color: white;
            font-size: x-large;
            padding: 10px;
            font-weight: 1000px;
        }

        .search-container {
            display: flex;
            gap: 20px;
            width: 80%;
            max-width: 1000px;
            justify-content: center;
            align-items: center;
            margin-left: 250px;


        }

        .order {
            display: grid;
            grid-template-columns: repeat(3, );
            /* 4 images in one row */
            gap: 10px;
            margin-top: 100px;
            flex-direction: column;

        }
        .nav-btn{
            display: flex;
            justify-content: space-between;
            margin-right: 20px;
            white-space: nowrap;
        }
        .button-container{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search{
            height: 62px;
            width: 300px;
            border-radius: 10px;
            border: #fff;
            background-color: #fff;
            color: black;
            text-align: center;
        }
        .food{
             height: 62px;
            width: 500px;
            border-radius: 10px;
            border: #fff;
            background-color: #fff;
            color: black;
            text-align: center;
        }
         .parent {
            display: grid;
            grid-template-columns: repeat(12, calc(100%/12));
            width: 4000px;
            min-height: 300px;
            gap: 5px;
         }
         .child {
            background-color: black;
            border: 1px solid white;
            border-radius: 40px;
            justify-content: center;
         }
    </STYLE>
</head>

<body>

    <div class="navigation-bar">
        <div class="logo"> <img
                src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/static-assets/images/swiggy_logo_white.png"
                alt="" class="logo-img">
        </div>
        <div class="link">
             <p>swiggy corporate</p>
             <p>partners with us</p>
        </div>
        <div class="nav-btn">
            <button class="app-btn">
               <p> Get the App <span>↗</span>
            </button>
            <div class="signin-btn">
                Sign in
            </div>
        </div>

    </div>
    <div class="head">
        <h1>
            <br> Order food & groceries. Discover</br> best restaurants. Swiggy it!
        </h1>
    </div>
    <div class="button-container">
        <input type="search" placeholder="enter your location" class="search">
        <input type="search" placeholder="Search for restaurant, item or more" class="food">
    </div>
    <div class="parent">
        <div  class="child background-image url https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/ec86a309-9b06-48e2-9adc-35753f06bc0a_Food3BU.png"> <img src="" alt=""> </div>
        <div  class="child"></div>
        <div  class="child"></div>
    </div>
    


</body>
