<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }
        body{
            justify-content:center;
            height: 100vh;
            align-items: center;
            display: flex;
            gap: 2px;


        }
        .box{
            height: 140px;
            width: 70px;
            border-radius: 10px;
            transform: skew(-20deg);
            background-color: rgb(254, 250, 250);
            border: 1px solid rgb(247, 244, 244)

        }
        .box:hover{
            background-color: cyan;
            scale: 0.8;
        }
        .box:not(:hover){
            transition: all ease-in-out 600ms;
        }


    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>
</html>
