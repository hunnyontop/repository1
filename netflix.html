<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX</title>
    <STYLE>
        * {
            margin: 0;
        }
 body {
            background-image: radial-gradient(circle,
                    rgba(0, 0, 0, 0.2) 40%,
                    rgba(0, 0, 0, 0.804) 100%), url("https://assets.nflxext.com/ffe/siteui/vlv3/a565a928-abda-47bd-860a-55be00b7fefc/web/IN-en-20260615-TRIFECTA-perspective_7ffb95f0-7b86-4dfa-9920-7f5651418d65_large.jpg");
            background-size: cover;
            /* Makes image cover entire page */
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
        }
       
        .navigation {
            display: flex;
            text-align: center;
            justify-content: space-around;
            padding: 15px;
            text-decoration: 0;
        }
        .logo-img{
            width: 140px;
        }
         button {
            padding: 6px 20px;
            border-radius: 10px;
            background-color: red;
            border-color: red;
            margin-top: 2px;
            color: aliceblue;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            margin-left: 1000px;
        }
        h1 {
            text-align: center;
            margin: 70px;
            font-size: 60px;
            color: white;
        }
        p{
            text-align: center;
            font-size: 20px;
            color: white;
        }
    h2{
        color: white;
        text-align: center;
        font-size: 15px;
        margin-top: 20px;
    }
    .colum{
        text-align: center;
        margin-top: 20px;
        justify-content:space-evenly;
        display: flex;

        
    }
    </STYLE>
</head>

<body>

    <div class="navigation">
        <div class="logo"> <img src="https://pngimg.com/uploads/netflix/netflix_PNG32.png" alt="" class="logo-img">
        </div>
        <div class="cta"> <button> login </button> </div>
    </div>
    <div class="heading">
        <h1>
            <br> Unlimited movies,</br> shows, and more
        </h1>
        <p>
            Starts at ₹149. Cancel at any time.
        </p>
        <h2>
            Ready to watch? Enter your email to create or restart your membership.
        </h2>
        <div class="colum">
            <form>
                 <input type="text" placeholder="enter your email ">
                 
            </form>
            <div class="go">
            <button>
                Get started ~
            </button>
            </div>
            
        </div>
    </div>

</body>

</html>
